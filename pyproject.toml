[project]
name = "dispatch"
version = "0.1.0"
description = "An inference engine for the token-routing layer of Mixture-of-Experts models"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "bsreecharanreddy", email = "283869510+bsreecharanreddy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "accelerate>=1.15.0",
    "huggingface_hub>=1.31.0",
    "safetensors>=0.8.0",
    # Linux-only: triton publishes manylinux wheels and nothing else.
    "triton>=3.8.0; sys_platform == 'linux'",
    "grpcio>=1.84.0",
    # The generated dispatch_pb2.py imports google.protobuf directly at
    # runtime -- previously only available transitively via the dev-only
    # grpcio-tools, so a --no-dev install (the model server's Docker
    # image) had grpcio but not protobuf. Found live: a docker-compose
    # run of the built image raised ModuleNotFoundError: No module named
    # 'google' on startup.
    "protobuf>=7.36.2",
]

# Runtime dependencies (torch, triton, the serving stack) get added as each
# is needed, each floor checked live against pypi.org's JSON API at the
# time it's added -- not guessed or carried over from a plan.

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "types-requests>=2.33.0.20260906",
    "grpcio-tools>=1.84.0",
    "types-grpcio>=1.83.0.20260730",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    "src/dispatch/proto/dispatch_pb2.py",
    "src/dispatch/proto/dispatch_pb2.pyi",
    "src/dispatch/proto/dispatch_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Comparing against expected literals is normal and readable in tests.
"tests/**/*.py" = ["PLR2004", "PLR0913", "PLR0917"]
# Triton kernel signatures are pointer/stride/tile-size lists by construction,
# and Triton's convention is UPPER_CASE for tl.constexpr arguments.
"src/dispatch/kernels/grouped_gemm.py" = ["N803", "PLR0913", "PLR0917"]
"src/dispatch/kernels/grouped_gemm_int8.py" = ["N803", "PLR0913", "PLR0917"]
# Expert-parallel sharding/dispatch functions carry routing inputs plus a
# pluggable GEMM and tile size, same shape as moe_forward.py's own functions.
"src/dispatch/kernels/expert_parallel.py" = ["PLR0913", "PLR0917"]
# Phase 4's pod-live rank-orchestration scripts (torchrun-only, not
# imported by anything else): the prefill/decode role branch inside one
# function is what keeps every rank's collective calls in the same
# deterministic order (see their own docstrings), so splitting it up
# would risk the exact synchronization these scripts were debugged
# against. Rank ids (0/1 prefill, 2/3 decode) are the real protocol, not
# magic numbers to extract into constants.
"scripts/gpu/phase4_correctness_gate.py" = ["PLR0915", "PLR2004"]
"scripts/gpu/phase4_concurrency.py" = ["PLR0915", "PLR2004", "C901"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
# Generated protobuf/grpc code, excluded from direct checking -- the
# dispatch.proto.* override below (follow_imports="skip") only changes how
# this module is treated when *imported*, not when mypy walks `src` and
# hits it directly as a root target; found live when the override alone
# still left 10 errors inside these exact two files.
exclude = ["^src/dispatch/proto/dispatch_pb2(_grpc)?\\.pyi?$"]

# Triton isn't installed at all on macOS. Skipping it makes mypy treat it as
# Any everywhere, so the Mac and Linux CI give the same answer.
[[tool.mypy.overrides]]
module = ["triton", "triton.*"]
ignore_missing_imports = true
follow_imports = "skip"

# deep_ep needs 2 real GPUs to even build -- neither this dev box nor CI has
# that, same boundary as triton above.
[[tool.mypy.overrides]]
module = ["deep_ep", "deep_ep.*"]
ignore_missing_imports = true
follow_imports = "skip"

# vLLM and SGLang are only installed in Phase 6's rented-pod engine venv, never
# on this dev box or CI (they pin torch==2.13.0 and need a CUDA build), so their
# adapters import them lazily and mypy treats them as Any, same boundary as
# triton and deep_ep above.
[[tool.mypy.overrides]]
module = ["vllm", "vllm.*", "sglang", "sglang.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Generated protobuf/grpc code -- dispatch_pb2.py's message classes have a
# .pyi (gen_proto.py's --pyi_out), but dispatch_pb2_grpc.py's service/stub/
# servicer classes have no official pyi generator and stay untyped, which
# under --strict makes every call into them a "call to untyped function"
# error at the caller. follow_imports="skip" (not ignore_errors, which only
# suppresses errors *inside* the module, not "untyped call" errors at
# *importers*) makes mypy treat the whole module as Any, same boundary as
# triton/deep_ep/vllm/sglang above -- found live when ignore_errors alone
# still left 14 real errors in files that import this module.
[[tool.mypy.overrides]]
module = ["dispatch.proto.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["src/dispatch"]

[tool.pytest.ini_options]
# scripts/gpu/deepep_smoke_test.py matches pytest's default *_test.py glob
# but isn't a pytest test (it needs torch.distributed + 2 real GPUs +
# deep_ep, run via torchrun, not pytest) -- scope collection to tests/.
testpaths = ["tests"]
markers = [
    "gpu: needs a real CUDA device -- excluded from CI, run locally or on a rented instance",
    "slow: excluded from the fast inner-loop selection",
]
