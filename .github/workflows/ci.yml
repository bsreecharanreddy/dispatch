name: CI

on:
  push:
    branches: [main]
    # A docs-only push cannot change what the suite checks -- same reasoning
    # as almanac's ci.yml: GitHub skips a run only when *every* path in the
    # push diff matches paths-ignore, so a commit touching both docs and
    # code still runs.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:

# One run per ref at a time; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Both pins checked live against GitHub's release API on 2026-09-14,
      # not carried over from another repo. checkout publishes a floating
      # major tag; setup-uv does not (Almanac's ci.yml hit an unresolvable
      # `@v10` for exactly this reason), so setup-uv stays pinned exact.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync --all-extras --dev

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests

      # No GPU on a hosted runner -- anything marked `gpu` runs locally or
      # on a rented instance instead. See Makefile and pyproject.toml's
      # [tool.pytest.ini_options] for the marker.
      - run: uv run pytest -m "not gpu" -v
