apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: dispatch-demo
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: dispatch-demo
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: dispatch
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-dispatch
  namespace: dispatch-demo
data:
  dispatch-router.json: |
    {
      "title": "Dispatch Router - Phase 7 Demo",
      "uid": "dispatch-router-demo",
      "schemaVersion": 39,
      "refresh": "5s",
      "time": { "from": "now-5m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Requests total",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "dispatch_router_requests_total", "refId": "A" }]
        },
        {
          "id": 2,
          "title": "Queue depth",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 9, "x": 6, "y": 0 },
          "targets": [{ "expr": "dispatch_router_queue_depth", "refId": "A" }]
        },
        {
          "id": 3,
          "title": "Mean time to first token (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 9, "x": 15, "y": 0 },
          "targets": [
            {
              "expr": "dispatch_router_ttft_seconds_sum / dispatch_router_ttft_seconds_count",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: dispatch-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          ports:
            - containerPort: 3000
          env:
            # Anonymous admin access is fine here: this cluster is local-
            # only, demoed once, and torn down (design doc SS6/SS7,
            # "no standing public deployment") -- it avoids a login step
            # in the automated screenshot capture (Task 13/14) for a
            # cluster that never leaves the dev machine.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-dispatch
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-dispatch
          configMap:
            name: grafana-dashboard-dispatch
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: dispatch-demo
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
